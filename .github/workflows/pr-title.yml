# Lint the pull-request title against Conventional Commits.
#
# This repository squash-merges, so the pull-request title becomes the commit
# subject on main, and that subject is what release-please parses to decide the
# next version. A sloppy title is a missed release or a wrong bump.
#
# The trigger is pull_request_target because a pull_request run from a fork gets
# a read-only token, and this repository is public, so forks are a real case.
# That trigger is safe here because the called workflow checks out nothing: it
# reads the pull-request title through the API and runs no code from the head
# ref, so no fork content ever executes with the elevated token.
#
# `labeled` / `unlabeled` are in the list so release-please's own
# `autorelease: pending` label takes effect on its release pull request
# immediately rather than on the next edit.
#
# The caller job id is `pr-title` and the called job is also named `pr-title`,
# so the status-check context is `pr-title / pr-title`.

name: PR title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  pull-requests: read

jobs:
  pr-title:
    uses: Misoto22/ci/.github/workflows/pr-title.yml@65443cf5cd7c65b978373aeb0a0e93127b0d6ede # v0.5.0
