# The half that needs a rendering engine. Separate from `verify` because it
# downloads a browser and takes longer, and because a failure here says
# something different: not "the code is wrong" but "the rendered page is wrong".
name: Browser

on:
  workflow_call:
    inputs:
      verified:
        description: >-
          The tree was already checked (see verify.yml). Every shard still
          starts and reports, so the required `browser / browser` check
          stays green, but none of them builds or drives a browser.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Sharded, because the suite grows with the library and a single runner
    # stopped clearing the timeout. The a11y sweep is the reason: it visits
    # every published page in both themes, and component pages twice over
    # because half the page lives behind the Properties tab — so its cost is
    # the component count times four, and the component count is the number
    # this project exists to grow.
    #
    # Sharding rather than a larger timeout. A timeout raised to fit today's
    # suite is a timeout that gets raised again, and each raise is a slower
    # answer to "is this branch broken" for everybody. Shards keep the whole
    # sweep and cut the wall clock instead.
    strategy:
      fail-fast: false
      matrix:
        #
        # Six, and each builds its own export: the shards used to wait for
        # `verify` to upload one, so a pull request paid verify's four minutes
        # and then the sweep's six to eight in series. Building in the shard
        # costs about a minute and a half and runs alongside verify instead.
        # A verified tree needs one placeholder shard, not six idle runners.
        shard: ${{ fromJSON(inputs.verified && '[1]' || '[1, 2, 3, 4, 5, 6]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !inputs.verified }}
      - uses: ./.github/actions/setup
        if: ${{ !inputs.verified }}

      - name: Install Chromium
        if: ${{ !inputs.verified }}
        run: pnpm --filter @misoto22/folio-docs exec playwright install --with-deps chromium

      # The suite serves the built export, so it tests the artifact that ships
      # rather than a dev server that renders through a different pipeline.
      # Same two commands verify.yml builds the deployed export with.
      - name: Build the static export
        if: ${{ !inputs.verified }}
        run: |
          pnpm build:design
          pnpm build:docs

      # `exec playwright` rather than the `test:e2e` script: pnpm forwards `--`
      # to the script verbatim, so Playwright received a literal `--` and ran
      # the whole suite on every shard — three times the work and none of the
      # speed.
      - name: Accessibility and keyboard suite
        if: ${{ !inputs.verified }}
        run: pnpm --filter @misoto22/folio-docs exec playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # One name per shard: same-named artifacts collide, and the report
          # that matters is the one from the shard that actually failed.
          name: playwright-report-${{ matrix.shard }}
          path: apps/docs/playwright-report
          retention-days: 7

  # The name the branch ruleset requires, and the reason this job exists at
  # all. A matrix job reports one check per shard — `browser / browser (1)` and
  # so on — so the required context `browser / browser` simply stopped being
  # produced, and every pull request sat mergeable and blocked with six green
  # checks and nothing to click. This is one check that is green only when
  # every shard is, so the required name survives the shard count changing.
  browser:
    runs-on: ubuntu-latest
    needs: shard
    if: always()
    steps:
      - name: Every shard passed
        # `needs.shard.result` is the matrix's aggregate: `success` only when
        # all of them succeeded. Without `if: always()` above, a failed shard
        # would skip this job rather than fail it, and a skipped required check
        # blocks instead of reporting — the same dead end in a different shape.
        run: |
          echo "shards: ${{ needs.shard.result }}"
          [ "${{ needs.shard.result }}" = "success" ]
