# What happens to `main`. Everything that leaves this repository leaves from
# here: the documentation site to Cloudflare Pages, the package to npmjs.
#
# The version is decided by release-please rather than by a file somebody
# remembered to write: it reads the Conventional Commit subjects since the last
# tag, opens a release pull request, and on merge writes the version, the
# changelog, the tag and the GitHub Release. `publish` then hangs off that.
#
# The name is load-bearing. npmjs matches a trusted publisher on the caller
# workflow's filename, so renaming this file stops publishing until the npmjs
# side is updated to match — and npm validates neither half when you save it,
# so the failure arrives as a 404 at publish time. That is also why the
# release-please caller is a job in this file rather than a workflow of its
# own. See docs/releasing.md.
name: Release

on:
  push:
    branches: [main]

# One at a time, and never cancelled mid-flight: a half-uploaded Pages
# deployment is a half-broken site, and a half-published package is worse.
#
# This protects a run that has STARTED. GitHub keeps only one queued run per
# group, so a run still waiting its turn is superseded by the next push — which
# is harmless here, because the later commit is a superset: it deploys the same
# site from a newer tree, and release-please recomputes the release pull request
# from the whole history rather than from the one commit that started the run.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The same two gates a pull request gets, from the same definitions. Deploying
  # and publishing hang off them, so nothing ships that they have not seen.
  #
  # Except when the pull request already ran them on this exact tree. `main`
  # requires an up-to-date branch, so a squash merge lands the head its pull
  # request tested; a release pull request's own run passed on a
  # version-only diff over an already-verified main. In both cases the gates
  # run in their `verified` form: they still report, and `verify` still
  # builds the export the deploy uploads, but nothing is checked twice. A
  # direct push, a stale tree or any API failure gets the full run.
  trust:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      verified: ${{ steps.pr.outputs.verified }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          verified=false
          tree=$(git rev-parse "HEAD^{tree}")
          head=$(gh api "repos/$REPO/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.merged_at != null)][0].head.sha // empty' || true)
          if [ -n "$head" ]; then
            head_tree=$(gh api "repos/$REPO/git/commits/$head" --jq .tree.sha || true)
            passed=0
            for check in "verify / verify" "browser / browser"; do
              n=$(gh api -X GET "repos/$REPO/commits/$head/check-runs" -f check_name="$check" --jq '[.check_runs[] | select(.conclusion == "success")] | length' || echo 0)
              [ "$n" -gt 0 ] && passed=$((passed + 1))
            done
            if [ "$head_tree" = "$tree" ] && [ "$passed" = 2 ]; then verified=true; fi
            echo "pull request head $head: tree match $([ "$head_tree" = "$tree" ] && echo yes || echo no), gates passed $passed/2"
          fi
          echo "verified=$verified" >> "$GITHUB_OUTPUT"
          echo "tree verified by its pull request: $verified"

  verify:
    needs: trust
    uses: ./.github/workflows/verify.yml
    with:
      verified: ${{ needs.trust.outputs.verified == 'true' }}

  browser:
    needs: trust
    uses: ./.github/workflows/browser.yml
    with:
      verified: ${{ needs.trust.outputs.verified == 'true' }}

  deploy:
    needs: [verify, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://ui.misoto22.com
    steps:
      - name: Download the static export
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-out
          path: out

      # Deploys the exact directory `verify` built and tested, rather than
      # rebuilding here — a second build is a second chance to ship something
      # the gates never saw.
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=folio-design --branch=main

      # Two checks, because they can fail independently and for different
      # reasons: the deployment can be broken, or the custom domain can have
      # come detached from the project.
      #
      # The routes are checked on the project's own *.pages.dev host rather than
      # on ui.misoto22.com. The custom domain sits behind the misoto22.com
      # zone's bot protection, which answers a GitHub runner with 403 — a real
      # 403 that says nothing at all about whether the site works. Checking the
      # origin the deployment actually serves is the honest test; the domain
      # attachment is then verified through the API, where a runner is a first-
      # class client.
      - name: Smoke-test the deployed routes
        run: |
          set -euo pipefail
          for route in / /components/ /components/button/ /foundations/colour/ /principles/; do
            # Six tries at ten seconds: a Pages deployment is live within a
            # minute, and a route that is not by then is a route that is broken.
            for _ in 1 2 3 4 5 6; do
              status=$(curl -sS -o /dev/null -w '%{http_code}' "https://folio-design.pages.dev${route}" || echo 000)
              [ "$status" = "200" ] && break
              sleep 10
            done
            echo "${route} -> ${status}"
            [ "$status" = "200" ] || exit 1
          done

      - name: Confirm ui.misoto22.com is still attached to the project
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl -sS -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/folio-design/domains" \
            | python3 -c "
          import json, sys
          domains = json.load(sys.stdin)['result']
          found = [d for d in domains if d['name'] == 'ui.misoto22.com']
          if not found:
              sys.exit('ui.misoto22.com is not attached to the folio-design project')
          print('ui.misoto22.com ->', found[0]['status'])
          "

  # Decides the next version and opens "chore(main): release folio X.Y.Z".
  # Merging that pull request writes `packages/design/package.json` and
  # `packages/design/CHANGELOG.md`, tags `vX.Y.Z` and publishes the GitHub
  # Release — and the tag event is what the `publish` job below hangs off.
  #
  # Gated on the same two checks as everything else here, because a release
  # this repository cannot recall is cut from whatever `main` holds: npm does
  # not let a version number be reused.
  release:
    needs: [verify, browser]
    uses: Misoto22/ci/.github/workflows/release.yml@121edc748cf9c4c062572ee9b1275460c4a17a40 # v0.11.0
    permissions:
      contents: write
      pull-requests: write
      issues: write
    with:
      app-client-id: ${{ vars.APP_CLIENT_ID }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  # Deliberately a job in this file rather than a reusable workflow: npmjs
  # matches the trusted publisher on the caller, and keeping the publish here
  # means `job_workflow_ref` and `workflow_ref` name the same file, with nothing
  # to get out of step.
  publish:
    needs: [verify, browser, release]
    # `releases_created` and not `release_created`. The singular output is the
    # ROOT path's, and this manifest has no root path — its one package is
    # `packages/design` — so the root outputs are empty on every run, including
    # the runs that released. The plural is the manifest-wide answer.
    if: needs.release.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    # Room for the build and the registry wait below, which alone is ten.
    timeout-minutes: 20
    permissions:
      # Mints the short-lived OIDC token npmjs exchanges for publish rights, and
      # the whole reason no npm credential is stored anywhere.
      #
      # Nothing else is granted, because nothing else uses this token. The
      # version commit, the pull request, the tag and the GitHub Release are all
      # written by the release bot in the job above, under its own App token.
      contents: read
      id-token: write
    steps:
      # The tag release-please just wrote, not `github.sha`. Runs queue on the
      # `release` group, and release-please reads `main` as it is when its job
      # runs: on 2026-11-14 the run for one commit found the next release pull
      # request already merged, tagged v0.20.1, then built its own older tree,
      # still 0.20.0, and npm answered "no new packages". The run for the
      # release commit itself saw the tag already there and skipped publishing,
      # so v0.20.1 never reached npm.
      - name: Find the release this run created
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${tag}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}

      # The tree must be the version it is published as; otherwise the publish
      # below is a silent no-op and the registry check confirms the old version.
      - name: Confirm the checkout is the tagged version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/design/package.json').version")
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::packages/design is ${version}, the release is ${TAG}"
            exit 1
          fi

      - uses: ./.github/actions/setup
        with:
          # Points the `.npmrc` at npmjs. It also writes a literal
          # `_authToken=${NODE_AUTH_TOKEN}` line, and nothing sets that variable
          # — pnpm 11.1.3 and later drop an unresolved placeholder rather than
          # sending it as a bearer token, which is what lets OIDC take over.
          # Below that version the placeholder reached the registry verbatim and
          # every publish 404'd (pnpm#11513); this repository pins 11.9.0.
          registry-url: https://registry.npmjs.org
          scope: '@misoto22'

      - name: Build the design package
        run: pnpm build:design

      - name: Publish @misoto22/folio
        env:
          # Attaches the provenance attestation to the published tarball. It is
          # what `id-token: write` above is spent on besides the publish itself.
          NPM_CONFIG_PROVENANCE: 'true'
        run: pnpm --filter @misoto22/folio publish --access public --no-git-checks

      # A publish is not readable the instant it returns: `0.5.0` went out, the
      # old tag step asked, npm said no, and the same query answered yes less
      # than a minute later. So the job does not call itself done on the CLI's
      # exit code alone — it asks the registry, because the registry is what a
      # consumer will ask.
      #
      # The wait is ten minutes, not one. 0.19.0, 0.19.1 and 0.20.0 all
      # published and all failed here, because npm took longer than a minute
      # to serve them. Ten minutes still ends inside the job's timeout, so a
      # publish that never appears fails this step by name rather than by a
      # cancelled job.
      - name: Confirm the registry serves it
        timeout-minutes: 12
        run: |
          set -euo pipefail

          # Read rather than hard-coded: the package was renamed once, and a
          # literal name here would ask the registry about the old one and
          # report a green publish of nothing.
          name=$(node -p "require('./packages/design/package.json').name")
          version=$(node -p "require('./packages/design/package.json').version")

          # `--prefer-online` skips the local cache, so every attempt asks the
          # registry again instead of replaying an earlier 404.
          deadline=$(( SECONDS + 600 ))
          delay=5
          published=""
          last_error=""
          while :; do
            if published=$(npm view --prefer-online "${name}@${version}" version 2>"${RUNNER_TEMP}/npm-view.err"); then
              [ "$published" = "$version" ] && break
            fi
            last_error=$(tail -n 3 "${RUNNER_TEMP}/npm-view.err" || true)
            if [ "$SECONDS" -ge "$deadline" ]; then
              break
            fi
            echo "not served yet; asking again in ${delay}s"
            sleep "$delay"
            delay=$(( delay * 2 > 60 ? 60 : delay * 2 ))
          done

          if [ "$published" != "$version" ]; then
            echo "::error title=Publish not visible::${name}@${version} is not on the registry ten minutes after publishing."
            if [ -n "$last_error" ]; then echo "last npm view error: ${last_error}"; fi
            exit 1
          fi
          echo "published: ${name}@${version}"

      # The site adopts every release (its pnpm config exempts folio from the
      # release-age delay for that reason), so it is told rather than left to
      # notice on Dependabot's weekly run. misoto22-site's folio-release.yml
      # opens the bump pull request and merges it once its CI passes. Sent
      # after the registry check: the site installs from npm, so the version
      # has to be readable there first.
      - name: Mint a token for misoto22-site
        id: site-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: Misoto22
          repositories: misoto22-site

      - name: Tell misoto22-site about the release
        env:
          GH_TOKEN: ${{ steps.site-token.outputs.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/design/package.json').version")
          gh api repos/Misoto22/misoto22-site/dispatches \
            -f event_type=folio-released \
            -f "client_payload[version]=${version}"
          echo "dispatched folio-released ${version}"
