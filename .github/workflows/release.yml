# What happens to `main`. Everything that leaves this repository leaves from
# here: the documentation site to Cloudflare Pages, the package to npmjs.
#
# The version is decided by release-please rather than by a file somebody
# remembered to write: it reads the Conventional Commit subjects since the last
# tag, opens a release pull request, and on merge writes the version, the
# changelog, the tag and the GitHub Release. `publish` then hangs off that.
#
# The name is load-bearing. npmjs matches a trusted publisher on the caller
# workflow's filename, so renaming this file stops publishing until the npmjs
# side is updated to match — and npm validates neither half when you save it,
# so the failure arrives as a 404 at publish time. That is also why the
# release-please caller is a job in this file rather than a workflow of its
# own. See docs/releasing.md.
name: Release

on:
  push:
    branches: [main]

# One at a time, and never cancelled mid-flight: a half-uploaded Pages
# deployment is a half-broken site, and a half-published package is worse.
#
# This protects a run that has STARTED. GitHub keeps only one queued run per
# group, so a run still waiting its turn is superseded by the next push — which
# is harmless here, because the later commit is a superset: it deploys the same
# site from a newer tree, and release-please recomputes the release pull request
# from the whole history rather than from the one commit that started the run.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The same two gates a pull request gets, from the same definitions. Deploying
  # and publishing hang off them, so nothing ships that they have not seen.
  verify:
    uses: ./.github/workflows/verify.yml

  browser:
    needs: verify
    uses: ./.github/workflows/browser.yml

  deploy:
    needs: [verify, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://ui.misoto22.com
    steps:
      - name: Download the static export
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-out
          path: out

      # Deploys the exact directory `verify` built and tested, rather than
      # rebuilding here — a second build is a second chance to ship something
      # the gates never saw.
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=folio-design --branch=main

      # Two checks, because they can fail independently and for different
      # reasons: the deployment can be broken, or the custom domain can have
      # come detached from the project.
      #
      # The routes are checked on the project's own *.pages.dev host rather than
      # on ui.misoto22.com. The custom domain sits behind the misoto22.com
      # zone's bot protection, which answers a GitHub runner with 403 — a real
      # 403 that says nothing at all about whether the site works. Checking the
      # origin the deployment actually serves is the honest test; the domain
      # attachment is then verified through the API, where a runner is a first-
      # class client.
      - name: Smoke-test the deployed routes
        run: |
          set -euo pipefail
          for route in / /components/ /components/button/ /foundations/colour/ /principles/; do
            # Six tries at ten seconds: a Pages deployment is live within a
            # minute, and a route that is not by then is a route that is broken.
            for _ in 1 2 3 4 5 6; do
              status=$(curl -sS -o /dev/null -w '%{http_code}' "https://folio-design.pages.dev${route}" || echo 000)
              [ "$status" = "200" ] && break
              sleep 10
            done
            echo "${route} -> ${status}"
            [ "$status" = "200" ] || exit 1
          done

      - name: Confirm ui.misoto22.com is still attached to the project
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl -sS -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/folio-design/domains" \
            | python3 -c "
          import json, sys
          domains = json.load(sys.stdin)['result']
          found = [d for d in domains if d['name'] == 'ui.misoto22.com']
          if not found:
              sys.exit('ui.misoto22.com is not attached to the folio-design project')
          print('ui.misoto22.com ->', found[0]['status'])
          "

  # Decides the next version and opens "chore(main): release folio X.Y.Z".
  # Merging that pull request writes `packages/design/package.json` and
  # `packages/design/CHANGELOG.md`, tags `vX.Y.Z` and publishes the GitHub
  # Release — and the tag event is what the `publish` job below hangs off.
  #
  # Gated on the same two checks as everything else here, because a release
  # this repository cannot recall is cut from whatever `main` holds: npm does
  # not let a version number be reused.
  release:
    needs: [verify, browser]
    uses: Misoto22/ci/.github/workflows/release.yml@168697c01c8c24ce02a24a4e7b7b773e65c5cefe # v0.2.0
    permissions:
      contents: write
      pull-requests: write
      issues: write
    with:
      app-client-id: ${{ vars.APP_CLIENT_ID }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  # Deliberately a job in this file rather than a reusable workflow: npmjs
  # matches the trusted publisher on the caller, and keeping the publish here
  # means `job_workflow_ref` and `workflow_ref` name the same file, with nothing
  # to get out of step.
  publish:
    needs: [verify, browser, release]
    # `releases_created` and not `release_created`. The singular output is the
    # ROOT path's, and this manifest has no root path — its one package is
    # `packages/design` — so the root outputs are empty on every run, including
    # the runs that released. The plural is the manifest-wide answer.
    if: needs.release.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Mints the short-lived OIDC token npmjs exchanges for publish rights, and
      # the whole reason no npm credential is stored anywhere.
      #
      # Nothing else is granted, because nothing else uses this token. The
      # version commit, the pull request, the tag and the GitHub Release are all
      # written by the release bot in the job above, under its own App token.
      contents: read
      id-token: write
    steps:
      # The release commit itself: release-please tags the commit that merged
      # its pull request, which on this push event is `github.sha`. So the
      # version read below is the one that was just tagged, rather than one a
      # later push moved on from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          # Points the `.npmrc` at npmjs. It also writes a literal
          # `_authToken=${NODE_AUTH_TOKEN}` line, and nothing sets that variable
          # — pnpm 11.1.3 and later drop an unresolved placeholder rather than
          # sending it as a bearer token, which is what lets OIDC take over.
          # Below that version the placeholder reached the registry verbatim and
          # every publish 404'd (pnpm#11513); this repository pins 11.9.0.
          registry-url: https://registry.npmjs.org
          scope: '@misoto22'

      - name: Build the design package
        run: pnpm build:design

      - name: Publish @misoto22/folio
        env:
          # Attaches the provenance attestation to the published tarball. It is
          # what `id-token: write` above is spent on besides the publish itself.
          NPM_CONFIG_PROVENANCE: 'true'
        run: pnpm --filter @misoto22/folio publish --access public --no-git-checks

      # A publish is not readable the instant it returns: `0.5.0` went out, the
      # old tag step asked, npm said no, and the same query answered yes less
      # than a minute later. So the job does not call itself done on the CLI's
      # exit code alone — it asks the registry, because the registry is what a
      # consumer will ask.
      - name: Confirm the registry serves it
        run: |
          set -euo pipefail

          # Read rather than hard-coded: the package was renamed once, and a
          # literal name here would ask the registry about the old one and
          # report a green publish of nothing.
          name=$(node -p "require('./packages/design/package.json').name")
          version=$(node -p "require('./packages/design/package.json').version")

          published=""
          for _ in 1 2 3 4 5 6; do
            published=$(npm view "${name}@${version}" version 2>/dev/null || true)
            [ "$published" = "$version" ] && break
            sleep 10
          done

          if [ "$published" != "$version" ]; then
            echo "::error title=Publish not visible::${name}@${version} is not on the registry a minute after publishing."
            exit 1
          fi
          echo "published: ${name}@${version}"
